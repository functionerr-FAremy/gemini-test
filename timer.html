<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Set Timer</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="タイマー">
    
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #1c1c1e;
            --primary-color: #007aff;
            --secondary-color: #34c759;
            --danger-color: #ff3b30;
            --accent-color: #5856d6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-color: #ffffff;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header { padding: 20px 0; text-align: center; font-weight: bold; font-size: 20px; }

        /* タイマー表示部分 */
        .timer-display {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .current-set-label { font-size: 14px; color: var(--primary-color); font-weight: 600; margin-bottom: 8px; }
        .time-left { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0; }

        /* コントロールボタン */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .btn {
            border: none; border-radius: 16px; padding: 18px; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-start { background-color: var(--secondary-color); color: white; grid-column: span 2; }
        .btn-pause { background-color: #ff9500; color: white; }
        .btn-reset { background-color: #8e8e93; color: white; }

        /* セット管理部分 */
        .sets-container { flex-grow: 1; }
        .set-item {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .set-item.active { border: 2px solid var(--primary-color); }
        .set-info { font-weight: 600; }
        .set-inputs { display: flex; align-items: center; gap: 8px; }
        .set-inputs input {
            width: 60px; height: 40px; border-radius: 8px; border: 1px solid #ddd;
            text-align: center; font-size: 18px; background: var(--bg-color); color: var(--text-color);
        }

        .add-set-btn {
            width: 100%; padding: 15px; border-radius: 16px; border: 2px dashed #8e8e93;
            background: transparent; color: #8e8e93; font-size: 16px; font-weight: 600; margin-bottom: 40px;
        }

        .btn-delete { background: none; border: none; color: var(--danger-color); font-size: 20px; padding: 0 10px; }

        /* モーダル */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 24px; width: 85%; max-width: 320px; text-align: center;
        }
        .modal-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }

        .hidden { display: none; }
    </style>
</head>
<body>

<header>Multi-Set Timer</header>

<div class="timer-display">
    <div id="current-set-name" class="current-set-label">READY</div>
    <div id="display-time" class="time-left">00:00</div>
    <div id="total-progress" style="font-size: 12px; opacity: 0.6;">Sets: 0 / 0</div>
</div>

<div class="controls">
    <button id="start-btn" class="btn btn-start" onclick="startTimer()">スタート</button>
    <button id="pause-btn" class="btn btn-pause hidden" onclick="pauseTimer()">一時停止</button>
    <button id="reset-btn" class="btn btn-reset" onclick="resetTimer()">リセット</button>
</div>

<div class="sets-container" id="sets-list">
    </div>

<button class="add-set-btn" onclick="addSet()">＋ セットを追加</button>

<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">Set Complete!</h2>
        <div class="modal-btns">
            <button class="btn btn-start" onclick="nextStep()">次のセットへ進む</button>
            <button class="btn btn-reset" onclick="retrySet()">このセットをリトライ</button>
        </div>
    </div>
</div>

<script>
    let sets = [{ min: 0, sec: 10 }]; // 初期セット
    let currentSetIndex = 0;
    let timeLeft = 0;
    let timerId = null;
    let audioCtx = null;

    // 初期表示
    renderSets();
    updateDisplay();

    function renderSets() {
        const list = document.getElementById('sets-list');
        list.innerHTML = '';
        sets.forEach((set, index) => {
            const div = document.createElement('div');
            div.className = `set-item ${index === currentSetIndex ? 'active' : ''}`;
            div.innerHTML = `
                <div class="set-info">セット ${index + 1}</div>
                <div class="set-inputs">
                    <input type="number" value="${set.min}" onchange="updateSetTime(${index}, 'min', this.value)" placeholder="分">
                    <span>:</span>
                    <input type="number" value="${set.sec}" onchange="updateSetTime(${index}, 'sec', this.value)" placeholder="秒">
                    <button class="btn-delete" onclick="removeSet(${index})">×</button>
                </div>
            `;
            list.appendChild(div);
        });
        updateTotalProgress();
    }

    function addSet() {
        sets.push({ min: 0, sec: 10 });
        renderSets();
    }

    function removeSet(index) {
        if (sets.length > 1) {
            sets.splice(index, 1);
            if (currentSetIndex >= sets.length) currentSetIndex = sets.length - 1;
            renderSets();
            resetTimer();
        }
    }

    function updateSetTime(index, type, value) {
        sets[index][type] = parseInt(value) || 0;
        if (!timerId) resetTimer();
    }

    function updateDisplay() {
        if (!timerId && timeLeft === 0) {
            timeLeft = (sets[currentSetIndex].min * 60) + sets[currentSetIndex].sec;
        }
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('display-time').textContent = 
            `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        document.getElementById('current-set-name').textContent = `セット ${currentSetIndex + 1} 実行中`;
    }

    function updateTotalProgress() {
        document.getElementById('total-progress').textContent = `Sets: ${currentSetIndex + 1} / ${sets.length}`;
    }

    // 音声の初期化（ユーザー操作で呼び出す必要がある）
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playBeep() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    function startTimer() {
        initAudio();
        if (timerId) return;
        
        document.getElementById('start-btn').classList.add('hidden');
        document.getElementById('pause-btn').classList.remove('hidden');

        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
            } else {
                completeSet();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerId);
        timerId = null;
        document.getElementById('start-btn').classList.remove('hidden');
        document.getElementById('pause-btn').classList.add('hidden');
    }

    function resetTimer() {
        pauseTimer();
        currentSetIndex = 0;
        timeLeft = (sets[currentSetIndex].min * 60) + sets[currentSetIndex].sec;
        updateDisplay();
        renderSets();
    }

    function completeSet() {
        pauseTimer();
        playBeep();
        
        if (currentSetIndex === sets.length - 1) {
            alert('すべてのセットが完了しました！');
            resetTimer();
        } else {
            document.getElementById('modal').style.display = 'flex';
        }
    }

    function nextStep() {
        document.getElementById('modal').style.display = 'none';
        currentSetIndex++;
        timeLeft = (sets[currentSetIndex].min * 60) + sets[currentSetIndex].sec;
        updateDisplay();
        renderSets();
        startTimer();
    }

    function retrySet() {
        document.getElementById('modal').style.display = 'none';
        timeLeft = (sets[currentSetIndex].min * 60) + sets[currentSetIndex].sec;
        updateDisplay();
        startTimer();
    }
</script>
</body>
</html>
